apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slurm-state
  namespace: slurm
  labels:
    app.kubernetes.io/name: slurm
    app.kubernetes.io/part-of: aiidalab-openclaw-demo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: @STORAGE_CLASS@
  resources:
    requests:
      storage: 2Gi
---
