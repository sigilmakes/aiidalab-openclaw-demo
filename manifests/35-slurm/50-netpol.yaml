# Default-deny is global (10-network-policy.yaml); only the specific allows
# below. Everything is namespace-scoped: no ipBlock rules, so nothing here can
# reach or open a path to off-cluster private ranges.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slurm-allow-self
  namespace: slurm
  labels:
    app.kubernetes.io/name: slurm
    app.kubernetes.io/part-of: aiidalab-openclaw-demo
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
  # Controller <-> compute (6817/6818 RPC, munge reply traffic rides the same
  # connections); selftest job probes the controller the same way.
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slurm-allow-dns-egress
  namespace: slurm
  labels:
    app.kubernetes.io/name: slurm
    app.kubernetes.io/part-of: aiidalab-openclaw-demo
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slurm-allow-aiidalab-ingress
  namespace: slurm
  labels:
    app.kubernetes.io/name: slurm
    app.kubernetes.io/part-of: aiidalab-openclaw-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: slurm
      app.kubernetes.io/component: controller
  policyTypes: [Ingress]
  ingress:
  # AiiDA SSH transport and slurmctld RPC. Ports are in POD space: after the
  # Service DNAT, ssh on the wire is 2222 (sshd listener).
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: aiidalab
    ports:
    - protocol: TCP
      port: 2222
    - protocol: TCP
      port: 6817
