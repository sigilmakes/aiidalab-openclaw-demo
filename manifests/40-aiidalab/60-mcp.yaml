# MCP bridge: an authenticated front (bearer token) reverse-proxies to
# mcp-proxy, which fronts the aiida-agents stdio MCP server. Contract:
# ClusterIP `aiida-mcp` port 8080, called with
# `Authorization: Bearer <secret aiida-mcp-client key token>`.
#
# Two layers guard the write tool: the token in front.py, and an allow-list in
# server.py that refuses metadata.options keys AiiDA would copy verbatim into
# the batch script that runs on the compute node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiida-mcp-code
  namespace: aiidalab
  labels:
    app: aiida-mcp
data:
  server.py: |
    import ast, json, os, re, subprocess, sys, time

    import httpx
    from urllib.parse import quote
    from aiida_agents.mcp.server import get_mcp

    PLUGIN_DIR = os.environ.get('AIIDA_PLUGIN_DIR', '/plugins')

    # Plugin packages copied out of the lab venv by an init container. Only these
    # two directories, never the whole lab site-packages: that would make this venv
    # resolve cachetools from lab and fastmcp would fail at import.
    if os.path.isdir(PLUGIN_DIR) and PLUGIN_DIR not in sys.path:
        sys.path.insert(0, PLUGIN_DIR)
    from aiida_agents.mcp.tools import to_mcp_tool_error

    # AiiDA writes these verbatim into the sbatch script that runs on the compute
    # node, so accepting them from a caller would be remote shell execution as
    # aiida on compute01. The write tool exists to submit a calculation spec.
    FORBIDDEN = (
        "append_text", "prepend_text", "custom_scheduler_commands",
        "environment_variables", "scheduler_stdout", "scheduler_stderr",
        "submit_script_filename", "mpirun_extra_params",
    )
    # aiida-quantumespresso copies settings.CMDLINE into the pw.x command line.
    FORBIDDEN_SETTINGS = ("CMDLINE", "cmdline")

    SUB = """import json, sys

    from aiida import load_profile; load_profile()
    from aiida.orm import load_node

    # Matched on node_type rather than isinstance: this process imports aiida from
    # the lab venv, while the agents venv next to it has its own copy of the same
    # classes, so isinstance would compare two different class objects.
    spec = json.loads(sys.stdin.read())
    inputs = spec['inputs']

    def _pk(ref):
        return ref.get('pk') if isinstance(ref, dict) else ref


    code = inputs.get('code')
    if code is not None and _pk(code) is not None:
        node_type = load_node(_pk(code)).node_type
        if not node_type.startswith('data.core.code.installed'):
            raise ValueError('code %r is a %s, not an InstalledCode' % (code, node_type))
    for label, ref in (inputs.get('pseudos') or {}).items():
        if _pk(ref) is None:
            continue
        node_type = load_node(_pk(ref)).node_type
        if not node_type.startswith('data.pseudo'):
            raise ValueError('pseudo %r -> %r is a %s, not a pseudopotential' % (label, ref, node_type))

    from aiida_agents.tools.execution.spec_execution import submit_process_spec as submit
    from aiida_agents.tools.execution.submit import SubmissionInputError
    try:
        result = submit(spec)
    except SubmissionInputError as error:
        print(json.dumps({"kind": "submission_rejected", "stage": "validation", "submitted": False,
                          "error": {"type": type(error).__name__, "message": str(error)}}))
        sys.exit(0)
    try:
        structure = inputs.get('structure')
        if isinstance(structure, dict):
            structure = structure.get('pk')
        result['formula'] = load_node(structure).get_formula() if structure else ''
    except Exception:
        result['formula'] = ''
    print(json.dumps(result))
    """


    JUPYTER_URL = os.environ.get("JUPYTER_URL", "http://aiidalab:8888").rstrip("/")
    JUPYTER_TOKEN = os.environ.get("JUPYTER_TOKEN", "")
    PLUGIN_DIR = os.environ.get('AIIDA_PLUGIN_DIR', '/plugins')

    NOTEBOOK_DIR = "notebooks"


    def _notebook_name(path):
        """Return a bare notebook filename; the Jupyter contents API sees nothing else.

        These write files that Jupyter will later execute, so the notebook directory
        is the boundary: no separators, no dot-segments, no leading dot.
        """
        if not isinstance(path, str) or not path.strip():
            raise ValueError("path must be a non-empty notebook name")
        name = path.strip()
        if "/" in name or "\\" in name:
            raise ValueError("path must be a filename inside notebooks/, not a path: %r" % path)
        if name.startswith(".") or ".." in name:
            raise ValueError("path must not start with a dot or contain '..': %r" % path)
        if not name.endswith(".ipynb"):
            name += ".ipynb"
        return name


    def _jupyter(method, endpoint, **kwargs):
        if not JUPYTER_TOKEN:
            raise RuntimeError("JUPYTER_TOKEN is not set; cannot reach the Jupyter server")
        response = httpx.request(method, JUPYTER_URL + endpoint, timeout=30,
                                 headers={"Authorization": "token " + JUPYTER_TOKEN}, **kwargs)
        if response.status_code >= 400:
            raise RuntimeError("Jupyter %s %s -> %s: %s" % (method, endpoint, response.status_code,
                                                           response.text[:300]))
        return response.json() if response.content else {}


    _DIR_READY = []


    def _ensure_notebook_dir():
        """Create notebooks/ on first use: a fresh profile has no such directory."""
        if _DIR_READY:
            return
        try:
            _jupyter("PUT", "/api/contents/" + NOTEBOOK_DIR, json={"type": "directory"})
        except RuntimeError as error:
            if "409" not in str(error) and "already exists" not in str(error):
                raise
        _DIR_READY.append(True)


    def get_notebook_source(path: str, max_cells: int = 40, max_source_bytes: int = 20000) -> dict:
        """Read notebook cell sources only. Never execute cells or return their outputs.

        Give a filename inside notebooks/ including .ipynb. At most 100 cells and
        65536 UTF-8 source bytes may be returned; truncation and totals are explicit.
        """
        if not isinstance(path, str) or not path.endswith(".ipynb"):
            raise ValueError("path must be a notebook filename ending in .ipynb")
        name = _notebook_name(path)
        if name != path:
            raise ValueError("path must be an exact notebook filename without surrounding whitespace")
        if "%" in name or any(ord(char) < 32 for char in name):
            raise ValueError("notebook filename must not contain percent escapes or control characters")
        for value, maximum, label in ((max_cells, 100, "max_cells"),
                                       (max_source_bytes, 65536, "max_source_bytes")):
            if type(value) is not int or not 1 <= value <= maximum:
                raise ValueError("%s must be an integer between 1 and %s" % (label, maximum))
        model = _jupyter("GET", "/api/contents/" + NOTEBOOK_DIR + "/" + quote(name, safe=""),
                         params={"content": 1})
        content = model.get("content") if isinstance(model, dict) else None
        if (not isinstance(model, dict) or model.get("type") != "notebook"
                or not isinstance(content, dict) or content.get("nbformat") != 4
                or not isinstance(content.get("cells"), list)):
            raise ValueError("Jupyter did not return a version 4 notebook")
        sources = []
        for cell in content["cells"]:
            if not isinstance(cell, dict) or cell.get("cell_type") not in ("code", "markdown", "raw"):
                raise ValueError("invalid notebook cell type")
            source = cell.get("source", "")
            if isinstance(source, list) and all(isinstance(line, str) for line in source):
                source = "".join(source)
            if not isinstance(source, str):
                raise ValueError("invalid notebook cell source")
            sources.append((cell["cell_type"], source.encode("utf-8")))
        cells, returned = [], 0
        for kind, source in sources[:max_cells]:
            text = source[:max_source_bytes - returned].decode("utf-8", errors="ignore")
            size = len(text.encode("utf-8"))
            truncated = size < len(source)
            cells.append({"type": kind, "source": text, "truncated": truncated})
            returned += size
            if truncated:
                break
        return {"path": NOTEBOOK_DIR + "/" + name, "provenance": "jupyter_contents",
                "mtime": model.get("last_modified") if isinstance(model.get("last_modified"), str) else None,
            "cell_count_total": len(sources), "cells": cells,
                "source_bytes_total": sum(len(source) for _, source in sources),
                "source_bytes_returned": returned,
                "limits": {"max_cells": max_cells, "max_source_bytes": max_source_bytes},
                "truncated": len(cells) < len(sources) or any(cell["truncated"] for cell in cells)}


    def list_workspace(path: str = "") -> dict:
        """List the notebooks the agent has written, with size and modification time."""
        endpoint = "/api/contents/" + NOTEBOOK_DIR
        if path:
            endpoint += "/" + _notebook_name(path).rsplit(".ipynb", 1)[0]
        listing = _jupyter("GET", endpoint)
        entries = [{"name": item["name"], "is_dir": item["type"] == "directory",
                    "size": item.get("size"), "mtime": item.get("last_modified")}
                   for item in listing.get("content") or []]
        return {"url_path": endpoint.replace("/api/contents", ""), "entries": entries}


    JS_TOKENS = re.compile(r"(?<![\w.'\"])\b(true|false|null|undefined)\b(?![\w'\"])")


    def _validate_cells(built):
        """Reject cells that would fail in a Python kernel; the notebook is the product.

        A bare `true` in a dict literal parses as a name, so ast.parse accepts it and
        the cell only explodes at run time. Token-scan first, then parse, and name the
        cell index so the caller can repair one cell rather than the whole notebook.
        """
        for index, cell in enumerate(built):
            if cell.get("cell_type") != "code":
                continue
            source = "".join(cell.get("source") or [])
            if not source.strip():
                continue
            for token in JS_TOKENS.findall(source):
                raise ValueError(
                    "cell %d is not Python: bare %r. Write True/False/None." % (index, token))
            try:
                ast.parse(source)
            except SyntaxError as error:
                raise ValueError("cell %d does not parse: %s (line %s)" % (
                    index, error.msg, error.lineno))
        return True


    def write_notebook(path: str, cells: list, title: str = "") -> dict:
        """Write an nbformat 4 notebook into notebooks/ through the Jupyter server.

        cells is a list of {"type": "markdown"|"code", "source": "..."} objects.
        Jupyter creates the file, so it appears in the AiiDAlab file browser.
        """
        name = _notebook_name(path)
        _ensure_notebook_dir()
        if not isinstance(cells, list):
            raise ValueError("cells must be a list")
        built = []
        if title:
            built.append({"cell_type": "markdown", "metadata": {},
                          "source": ["# " + str(title).replace("\n", " ")]})
        for cell in cells:
            if not isinstance(cell, dict):
                raise ValueError("each cell must be an object")
            kind = cell.get("type", "code")
            if kind not in ("code", "markdown"):
                raise ValueError("cell type must be 'code' or 'markdown', got %r" % kind)
            source = cell.get("source", "")
            if not isinstance(source, str):
                raise ValueError("cell source must be a string")
            lines = source.splitlines(keepends=True) or [""]
            if kind == "markdown":
                built.append({"cell_type": "markdown", "metadata": {}, "source": lines})
            else:
                built.append({"cell_type": "code", "execution_count": None, "metadata": {},
                              "outputs": [], "source": lines})
        document = {"cells": built,
                    "metadata": {"kernelspec": {"display_name": "Python 3", "language": "python",
                                                "name": "python3"},
                                 "language_info": {"name": "python"}},
                    "nbformat": 4, "nbformat_minor": 5}
        _validate_cells(built)
        endpoint = "/api/contents/" + NOTEBOOK_DIR + "/" + name
        saved = _jupyter("PUT", endpoint, json={"type": "notebook", "format": "json",
                                                "content": document})
        in_aiidalab = "/lab/tree/" + saved.get("path", "")
        base = os.environ.get("JUPYTER_PUBLIC_URL", "https://@AIIDA_HOSTNAME@").rstrip("/")
        return {"path": saved.get("path"), "cells": len(built), "size": saved.get("size"),
                "in_aiidalab": in_aiidalab, "url": base + in_aiidalab}



    CREATE = r"""
    import json, sys
    from aiida import load_profile
    load_profile()
    from aiida.orm import StructureData
    spec = json.load(sys.stdin)
    structure = StructureData(cell=spec["cell"])
    for symbol, position in zip(spec["species"], spec["positions"]):
        structure.append_atom(symbols=symbol, position=position)
    if spec.get("name"):
        structure.label = spec["name"]
    structure.store()
    print(json.dumps({"pk": structure.pk, "uuid": structure.uuid,
                      "formula": structure.get_formula(), "sites": len(spec["species"])}))
    """

    CREATE_KPOINTS = r"""
    import json, sys
    from aiida import load_profile
    load_profile()
    from aiida.orm import KpointsData, load_node
    spec = json.load(sys.stdin)
    kpoints = KpointsData()
    if spec.get("mesh"):
        kpoints.set_kpoints_mesh(spec["mesh"])
    else:
        # A density is meaningless without the cell it refers to.
        if spec.get("structure_pk"):
            kpoints.set_cell_from_structure(load_node(spec["structure_pk"]))
        elif spec.get("cell"):
            kpoints.set_cell(spec["cell"])
        else:
            raise SystemExit("need structure_pk or cell to define the reciprocal cell")
        kpoints.set_kpoints_mesh_from_density(spec["distance"])
    if spec.get("name"):
        kpoints.label = spec["name"]
    kpoints.store()
    print(json.dumps({"pk": kpoints.pk, "uuid": kpoints.uuid,
                      "mesh": list(kpoints.get_kpoints_mesh()[0])}))
    """


    def create_kpoints(mesh: list = None, distance: float = None, structure: int = None,
                       cell: list = None, name: str = "") -> dict:
        """Create and store a KpointsData node, returning its pk and the mesh chosen.

        Give exactly one of mesh (three integers) or distance (a reciprocal-space
        density in 1/angstrom; 0.25-0.30 is the usual SSSP value). A distance needs a
        cell to work on: pass structure (a StructureData pk) or cell (three vectors).
        """
        if (mesh is None) == (distance is None):
            raise ValueError("give exactly one of mesh or distance")
        if distance is not None:
            try:
                distance = float(distance)
            except (TypeError, ValueError):
                raise ValueError("distance must be a number, got %r" % (distance,))
            if not 0.01 <= distance <= 1.0:
                raise ValueError("distance %r is outside the sensible range 0.01-1.0 1/A" % distance)
            if structure is None and cell is None:
                raise ValueError("distance needs structure (a pk) or cell to define the reciprocal cell")
        else:
            if (not isinstance(mesh, (list, tuple)) or len(mesh) != 3
                    or not all(isinstance(v, int) and 1 <= v <= 64 for v in mesh)):
                raise ValueError("mesh must be three integers between 1 and 64, got %r" % (mesh,))
            mesh = list(mesh)
        payload = {"mesh": mesh, "distance": distance,
                   "structure_pk": int(structure) if structure is not None else None,
                   "cell": cell, "name": str(name)[:200] if name else ""}
        p = subprocess.run([sys.executable, '-c', CREATE_KPOINTS], input=json.dumps(payload),
                           capture_output=True, text=True, timeout=300)
        if p.returncode != 0:
            raise RuntimeError((p.stderr or p.stdout).strip()[-800:])
        return json.loads(p.stdout)



    EXPORT = r"""
    import json, os, sys
    from aiida import load_profile
    load_profile()
    from aiida.orm import CalcJobNode, load_node
    pk, target = int(sys.argv[1]), sys.argv[2]
    node = load_node(pk)
    if not isinstance(node, CalcJobNode):
        raise SystemExit("process %s is not a CalcJob; use the CalcJob pk, not its retrieved folder" % pk)
    try:
        retrieved = node.outputs.retrieved
    except AttributeError:
        raise SystemExit("CalcJob %s has no retrieved output" % pk) from None
    os.makedirs(target, exist_ok=True)
    for name in retrieved.list_object_names():
        with retrieved.open(name, "rb") as handle, open(os.path.join(target, name), "wb") as out:
            out.write(handle.read())
    print(json.dumps({"dir": target, "files": retrieved.list_object_names()}))
    """


    def export_process_files(pk: int, limit_mb: int = 5) -> dict:
        """Copy a CalcJob's retrieved files into a NEW notebooks/<pk>-files/ directory.

        Refuse an existing destination before any PUT; never replace existing files.
        The pk is the CalcJob's, not its retrieved FolderData node.
        """
        import shutil
        import tempfile

        directory = "%s-files" % int(pk)
        endpoint = "/api/contents/%s/%s" % (NOTEBOOK_DIR, directory)
        try:
            _jupyter("GET", endpoint, params={"content": 0})
        except RuntimeError as error:
            if not str(error).startswith("Jupyter GET %s -> 404:" % endpoint):
                raise
        else:
            raise ValueError("Export destination already exists; refusing to overwrite %s" % directory)

        work = tempfile.mkdtemp()
        try:
            p = subprocess.run([sys.executable, "-c", EXPORT, str(int(pk)), work],
                               capture_output=True, text=True, timeout=600)
            if p.returncode != 0:
                raise RuntimeError((p.stderr or p.stdout).strip()[-400:])
            _ensure_notebook_dir()
            _jupyter("PUT", endpoint, json={"type": "directory"})
            written, skipped = [], []
            for name in sorted(os.listdir(work)):
                path = os.path.join(work, name)
                size = os.path.getsize(path)
                if size > limit_mb * 1024 * 1024:
                    skipped.append({"name": name, "size": size, "reason": "over %d MB" % limit_mb})
                    continue
                with open(path, "rb") as handle:
                    raw = handle.read()
                try:
                    text = raw.decode("utf-8")
                    payload = {"type": "file", "format": "text", "content": text}
                except UnicodeDecodeError:
                    import base64
                    payload = {"type": "file", "format": "base64",
                               "content": base64.b64encode(raw).decode()}
                _jupyter("PUT", endpoint + "/" + name, json=payload)
                written.append({"name": name, "size": size,
                                "url": _public_url("/lab/tree/%s/%s/%s" % (NOTEBOOK_DIR, directory, name))})
            return {"pk": int(pk), "dir": directory, "files": written, "skipped": skipped,
                    "url": _public_url("/lab/tree/%s/%s" % (NOTEBOOK_DIR, directory))}
        finally:
            shutil.rmtree(work, ignore_errors=True)


    def _accept_skipped_initialized_notification():
        """Let clients that skip `notifications/initialized` use the session anyway.

        mcp 1.30 rejects any request that arrives before the InitializedNotification
        with -32602, which is exactly what the OpenClaw runtime does on every
        connection: initialize, then straight to tools/list. By then the session
        exists -- we answered initialize and handed out a session id -- so the missing
        notification carries no information, and the client cannot be fixed here.
        Accept the request and mark the session initialized; initialize itself still
        goes through the original handler unchanged.
        """
        from mcp.server import session as _session

        original = _session.ServerSession._received_request

        async def _patched(self, responder, *extra):
            root = getattr(getattr(responder, "request", responder), "root", None)
            state = getattr(self, "_initialization_state", None)
            if (state == _session.InitializationState.Initializing
                    and not isinstance(root, _session.types.InitializeRequest)):
                self._initialization_state = _session.InitializationState.Initialized
                print("accepted request before notifications/initialized: %s"
                      % type(root).__name__, file=sys.stderr)
            return await original(self, responder, *extra)

        _session.ServerSession._received_request = _patched


    def _public_url(path):
        base = os.environ.get("JUPYTER_PUBLIC_URL", "https://@AIIDA_HOSTNAME@").rstrip("/")
        return base + path

    def create_structure(species: list, positions: list, cell: list, name: str = "") -> dict:
        """Create and store a StructureData node, returning its pk.

        species and positions are parallel lists; cell is three lattice vectors in
        angstrom. This is the only way an agent can introduce a new structure: the
        submit tool takes node references and nothing else.
        """
        if not isinstance(species, list) or not species:
            raise ValueError("species must be a non-empty list of element symbols")
        if not isinstance(positions, list) or len(positions) != len(species):
            raise ValueError("positions must be a list the same length as species (%d)" % len(species))
        if len(species) > 500:
            raise ValueError("refusing to build %d sites; 500 is the ceiling for this tool" % len(species))
        for symbol in species:
            if not isinstance(symbol, str) or not symbol.strip() or len(symbol.strip()) > 3:
                raise ValueError("bad element symbol %r" % (symbol,))
        clean_positions = []
        for site in positions:
            if not isinstance(site, (list, tuple)) or len(site) != 3:
                raise ValueError("each position must be three numbers, got %r" % (site,))
            clean_positions.append([float(v) for v in site])
        if not isinstance(cell, list) or len(cell) != 3:
            raise ValueError("cell must be three lattice vectors")
        clean_cell = []
        for vector in cell:
            if not isinstance(vector, (list, tuple)) or len(vector) != 3:
                raise ValueError("each cell vector must be three numbers, got %r" % (vector,))
            clean_cell.append([float(v) for v in vector])
        payload = {"species": [s.strip() for s in species], "positions": clean_positions,
                   "cell": clean_cell, "name": str(name)[:200] if name else ""}
        p = subprocess.run([sys.executable, '-c', CREATE], input=json.dumps(payload),
                           capture_output=True, text=True, timeout=300)
        if p.returncode != 0:
            raise RuntimeError((p.stderr or p.stdout).strip()[-800:])
        return json.loads(p.stdout)


    OUTPUTS = r"""
    import json, sys
    from aiida import load_profile
    load_profile()
    from aiida.orm import load_node
    pk = int(sys.argv[1])
    node = load_node(pk)
    files = []
    retrieved = node.outputs.get("retrieved")
    if retrieved is not None:
        for name in retrieved.list_object_names():
            try:
                files.append({"name": name, "size": retrieved.get_object_size(name)})
            except Exception:
                files.append({"name": name, "size": None})
    excerpt = ""
    try:
        text = retrieved.get_object_content("aiida.out")
        keep = []
        for line in text.splitlines():
            if any(mark in line for mark in ("highest occupied", "lowest unoccupied",
                                             "convergence has been achieved", "estimated scf accuracy",
                                             "total energy", "JOB DONE", "End of self-consistent")):
                keep.append(line.strip())
        excerpt = "\n".join(keep[-14:])
    except Exception as error:
        excerpt = "aiida.out unavailable: %s" % error
    print(json.dumps({"state": str(node.process_state), "exit_status": node.exit_status,
                      "files": files, "excerpt": excerpt}))
    """


    def _outputs_summary(pk):
        p = subprocess.run([sys.executable, "-c", OUTPUTS, str(int(pk))],
                           capture_output=True, text=True, timeout=300)
        if p.returncode != 0:
            raise RuntimeError((p.stderr or p.stdout).strip()[-400:])
        return json.loads(p.stdout)

    def _repro_cells(spec, result):
        """Rebuild from stored inputs, not the caller's lossy serialized spec."""
        pk = result.get("pk")
        if pk is None:
            raise ValueError("a submitted process pk is required for its notebook")
        expected_uuid = result.get("uuid")
        inspect = "\n".join([
            "from aiida import load_profile",
            "load_profile()",
            "from aiida.orm import load_node",
            "",
            "original = load_node(%r)" % pk,
            "expected_uuid = %r" % expected_uuid,
            "if expected_uuid and str(original.uuid) != str(expected_uuid):",
            "    raise ValueError('Process UUID does not match this notebook')",
            "print('Original process:', original.pk, original.uuid, original.process_type)",
            "print('State:', original.process_state, 'exit status:', original.exit_status)",
            "",
            "def show_inputs(namespace, prefix=''):",
            "    for name in namespace:",
            "        value = namespace[name]",
            "        path = prefix + name",
            "        if hasattr(value, 'uuid'):",
            "            print(path, 'pk:', value.pk, 'uuid:', value.uuid, 'label:', value.label)",
            "            if hasattr(value, 'get_formula') and hasattr(value, 'sites'):",
            "                print('Formula:', value.get_formula(), 'cell (Angstrom):', value.cell)",
            "                for site in value.sites:",
            "                    print('Site:', site.kind_name, 'position (Angstrom):', site.position)",
            "            elif hasattr(value, 'get_dict'):",
            "                print(value.get_dict())",
            "        elif hasattr(value, 'items'):",
            "            show_inputs(value, path + '.')",
            "        else:",
            "            print(path, value)",
            "",
            "show_inputs(original.inputs)",
        ])
        rerun = "\n".join([
            "# Run All is read-only by default. Enabling this creates a NEW process/job.",
            "ALLOW_RERUN = False",
            'RERUN_CONFIRMATION = ""',
            "if ALLOW_RERUN:",
            '    if RERUN_CONFIRMATION != "SUBMIT NEW PROCESS":',
            "        raise ValueError('Set RERUN_CONFIRMATION to SUBMIT NEW PROCESS only after compute approval')",
            "    from aiida.engine import submit",
            "    builder = original.get_builder_restart()",
            "    process = submit(builder)",
            "    print('New process:', process.pk, process.uuid)",
            "else:",
            "    print('No job submitted. Review inputs and obtain compute approval before enabling ALLOW_RERUN.')",
        ])
        outputs = "\n".join([
            "print('Original state:', original.process_state, 'exit status:', original.exit_status)",
            "for name in original.outputs:",
            "    value = original.outputs[name]",
            "    print('Output:', name, 'pk:', getattr(value, 'pk', None))",
            "    if hasattr(value, 'get_dict'):",
            "        print(value.get_dict())  # Keep energy values and their recorded units together.",
            "retrieved = getattr(original.outputs, 'retrieved', None)",
            "if retrieved is not None:",
            "    print('Retrieved files:', retrieved.list_object_names())",
            "    if 'aiida.out' in retrieved.list_object_names():",
            "        print(retrieved.get_object_content('aiida.out')[-1200:])",
            "else:",
            "    print('No directly linked retrieved folder. A workflow may expose results through child processes.')",
        ])
        return [
            {"type": "markdown", "source": "# Process %s — %s\n\nRecorded label/formula: %s. "
                "The cells below display the actual stored inputs; a label is not a geometry validation." % (
                    pk, spec.get("entry_point") or "stored process", result.get("formula") or "not supplied")},
            {"type": "markdown", "source": "## Inspect and rebuild\n\nThis is a same-profile restart notebook, "
                "not a standalone portable archive. It requires the original AiiDA profile, repository, "
                "input nodes, installed process plugins, code and compute environment. Native restart "
                "semantics preserve CalcJob or WorkChain inputs, including nested node references and options. "
                "Review actual species, cell, positions, parameters and resources before any rerun."},
            {"type": "code", "source": inspect},
            {"type": "markdown", "source": "## Optional rerun — explicit approval required\n\nRun All does not "
                "submit. Only after compute approval, set ALLOW_RERUN to True and RERUN_CONFIRMATION "
                "to SUBMIT NEW PROCESS. This confirmation is a UX guard, not authorization. "
                "The new pk is separate from the original process and its outputs below."},
            {"type": "code", "source": rerun},
            {"type": "markdown", "source": "## Original outputs\n\nQueued/running processes may not have outputs yet. "
                "Failed or killed processes are not successful results. Read the recorded state and exit status; "
                "keep parsed energy units with values and compare them with raw output units."},
            {"type": "code", "source": outputs},
        ]


    def _notebook_name_for(result):
        formula = re.sub(r"[^a-z0-9-]+", "-", str(result.get("formula") or "run").lower()).strip("-") or "run"
        return "%s-%s" % (int(result["pk"]), formula)


    def _write_repro_notebook(spec, result):
        """Write the notebook once or raise, retaining the caller's submitted-pk recovery path."""
        cells = _repro_cells(spec, result)
        return write_notebook(_notebook_name_for(result), cells,
                              title="%s %s" % (result.get("formula") or "Process", result.get("pk")))


    def _check(spec):
        from aiida.common.exceptions import MissingEntryPointError
        from aiida.plugins import CalculationFactory, WorkflowFactory
        from plumpy.ports import PortNamespace

        if not isinstance(spec, dict):
            raise TypeError('spec must be a dictionary, got %s' % type(spec).__name__)
        inputs = spec.get('inputs')
        if not isinstance(inputs, dict) or not inputs:
            raise ValueError("spec is missing required 'inputs' dictionary")
        entry_point = spec.get('entry_point')
        if not isinstance(entry_point, str) or not entry_point:
            raise ValueError("spec is missing required 'entry_point' string")
        try:
            process_class = CalculationFactory(entry_point)
        except MissingEntryPointError:
            try:
                process_class = WorkflowFactory(entry_point)
            except MissingEntryPointError as error:
                raise ValueError('unknown process entry_point: %s' % entry_point) from error
            except Exception as error:
                raise ValueError('process entry_point failed to load (%s)' % type(error).__name__) from error
        except Exception as error:
            raise ValueError('process entry_point failed to load (%s)' % type(error).__name__) from error

        def check_namespace(values, namespace, path):
            if not isinstance(values, dict):
                return  # The native process validator reports the invalid type.
            for name, value in values.items():
                port = namespace.get(name)
                current = path + '.' + name if path else name
                if isinstance(port, PortNamespace):
                    if name == 'options' and path.endswith('metadata'):
                        if not isinstance(value, dict):
                            raise ValueError(current + ' must be a dictionary')
                        refused = sorted(k for k in FORBIDDEN if k in value)
                        if refused:
                            raise ValueError('refused %s keys: %s' % (current, ', '.join(refused)))
                        if value.get('import_sys_environment') is True:
                            raise ValueError(current + '.import_sys_environment must not be true: slurmd runs rootless')
                    check_namespace(value, port, current)
                elif name == 'settings' and port is not None:
                    settings = value
                    if isinstance(value, dict) and any(k in value for k in ('pk', 'uuid', 'label')):
                        from aiida.orm import load_node
                        reference = next(value[k] for k in ('pk', 'uuid', 'label') if k in value)
                        settings = load_node(reference).get_dict()
                    if isinstance(settings, dict):
                        refused = sorted(k for k in FORBIDDEN_SETTINGS if k in settings)
                        if refused:
                            raise ValueError('refused %s keys: %s' % (current, ', '.join(refused)))

        check_namespace(inputs, process_class.spec().inputs, '')
        # Do not add CalcJob ports to a WorkChain. The rootless Slurm scheduler
        # override applies import_sys_environment=False to every actual job,
        # including CalcJobs created internally by a WorkChain.
        return spec


    def submit_process_spec(spec: dict) -> dict:
        """Submit an AiiDA process spec to the daemon and return its pk.

        The submission runs in a child process: AiiDA re-attaches the profile user
        on the calling thread, which fails on a second submission in one process.
        """
        from fastmcp.exceptions import ToolError

        try:
            spec = _check(spec)
        except (TypeError, ValueError) as error:
            raise ToolError(json.dumps({"kind": "submission_rejected", "stage": "validation",
                                       "submitted": False, "error": {"type": type(error).__name__,
                                       "message": str(error)}})) from error
        try:
            p = subprocess.run([sys.executable, '-c', SUB], input=json.dumps(spec),
                               capture_output=True, text=True, timeout=900)
        except subprocess.TimeoutExpired as error:
            raise ToolError(json.dumps({"kind": "submission_unknown", "stage": "submission",
                                       "submitted": None, "retry_safe": False,
                                       "error": {"type": "TimeoutExpired", "message":
                                       "The child did not return. Reconcile existing processes before retrying."}})) from error
        if p.returncode != 0:
            raise ToolError(json.dumps({"kind": "submission_unknown", "stage": "submission",
                                       "submitted": None, "retry_safe": False,
                                       "error": {"type": "ChildProcessError", "message":
                                       "Submission child exited without a reliable result (exit %s). "
                                       "Reconcile existing processes before retrying." % p.returncode}}))
        try:
            result = json.loads(p.stdout)
            if not isinstance(result, dict):
                raise ValueError('submission response must be an object')
            if result.get("kind") != "submission_rejected" and (
                    not isinstance(result.get("pk"), int) or isinstance(result.get("pk"), bool)
                    or result["pk"] <= 0):
                raise ValueError('submission response has no valid process identifier')
        except (ValueError, TypeError) as error:
            raise ToolError(json.dumps({"kind": "submission_unknown", "stage": "submission",
                                       "submitted": None, "retry_safe": False,
                                       "error": {"type": "InvalidChildResponse", "message":
                                       "Submission child returned an invalid result. "
                                       "Reconcile existing processes before retrying."}})) from error
        if result.get("kind") == "submission_rejected":
            raise ToolError(json.dumps(result))
        # The reproducibility guarantee lives here, not in a prompt: a submission is
        # not successful unless its notebook exists in AiiDAlab.
        try:
            notebook = _write_repro_notebook(spec, result)
        except Exception as error:
            return {"kind": "repro_notebook_required",
                    "pk": result.get("pk"), "state": result.get("state"),
                    "error": str(error)[-400:],
                    "retry": "the process exists but its notebook does not. Call "
                             "write_notebook with a name of the form '<pk>-<label>' and "
                             "the cells the agent would have written, then report that url."}
        result["notebook"] = notebook
        result["url"] = notebook.get("url")
        return result


    def main():
        m = get_mcp()
        m.tool()(to_mcp_tool_error(export_process_files))
        m.tool()(to_mcp_tool_error(create_kpoints))
        m.tool()(to_mcp_tool_error(create_structure))
        m.tool()(to_mcp_tool_error(submit_process_spec))
        m.tool()(to_mcp_tool_error(write_notebook))
        m.tool()(to_mcp_tool_error(list_workspace))
        m.tool()(to_mcp_tool_error(get_notebook_source))

        import pane

        pane.register(m, notebook_name_for=_notebook_name_for, public_url=_public_url,
                      list_workspace=list_workspace, submit_process_spec=submit_process_spec)
        import band_summary

        band_summary.register(m)
        import retrieved_head
        retrieved_head.register(m)
        import workspace_fs
        workspace_fs.register(m, jupyter=_jupyter, notebook_dir=NOTEBOOK_DIR, public_url=_public_url)
        _accept_skipped_initialized_notification()
        m.run(transport="stdio")


    if __name__ == "__main__":
        main()

