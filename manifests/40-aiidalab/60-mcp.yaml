    import os, signal, subprocess, sys, time
    import httpx, uvicorn
    from starlette.applications import Starlette
    from starlette.responses import JSONResponse, StreamingResponse
    from starlette.routing import Route

    TOKEN = os.environ.get("AIIDA_MCP_TOKEN", "")
    if len(TOKEN) < 16:
        sys.exit("AIIDA_MCP_TOKEN missing or too short; refusing to serve unauthenticated MCP")
    UPSTREAM = "http://127.0.0.1:8081"
    SKIP = {"connection", "keep-alive", "transfer-encoding", "te", "trailer", "upgrade",
            "proxy-authorization", "proxy-authenticate", "host", "content-length"}

    # --pass-environment: mcp-proxy hands the child only HOME/PATH/LC_CTYPE by
    # default, and the tools need JUPYTER_URL, JUPYTER_TOKEN and PYTHONPATH.
    proxy = subprocess.Popen(["/opt/venvs/agents/bin/mcp-proxy", "--host", "127.0.0.1",
                              "--port", "8081", "--pass-environment", "--",
                              "/opt/venvs/agents/bin/python", "/opt/mcp/server.py"])


    def bye(*_):
        proxy.terminate()
        sys.exit(0)


    signal.signal(signal.SIGTERM, bye)
    signal.signal(signal.SIGINT, bye)


    async def endpoint(request):
        header = request.headers.get("authorization", "")
        if header != "Bearer " + TOKEN:
            return JSONResponse({"jsonrpc": "2.0", "error": {"code": -32001, "message": "unauthorized"}},
                                status_code=401, headers={"WWW-Authenticate": "Bearer"})
        body = await request.body()
        headers = {k: v for k, v in request.headers.items() if k.lower() not in SKIP}
        url = UPSTREAM + request.url.path + (("?" + request.url.query) if request.url.query else "")
        client = httpx.AsyncClient(timeout=None)
        upstream = await client.send(client.build_request(request.method, url, headers=headers, content=body),
                                     stream=True)

        async def body_iter():
            try:
                async for chunk in upstream.aiter_raw():
                    yield chunk
            finally:
                await upstream.aclose()
                await client.aclose()

        return StreamingResponse(body_iter(), status_code=upstream.status_code,
                                 headers={k: v for k, v in upstream.headers.items() if k.lower() not in SKIP})


    app = Starlette(routes=[Route("/{path:path}", endpoint,
                                  methods=["GET", "POST", "DELETE", "OPTIONS"])])
    uvicorn.run(app, host="0.0.0.0", port=8080, log_level="warning")
