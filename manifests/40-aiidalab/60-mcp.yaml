    """OpenClaw pane tools: browse, open, run, tail — read + run over the substrate.

    Layering: submits go through submit_process_spec (its own subprocess), never
    in-process, because AiiDA re-attaches the profile user on the calling thread and
    a second submission in one process fails. Reads compose in-process from
    aiida_agents.tools, like the rest of the server.
    """

    import json
    import os
    from urllib.parse import quote

    from aiida_agents.mcp.tools import to_mcp_tool_error


    _callbacks = {}


    def _tools():
        from aiida_agents import tools as t
        return t


    def _ident(agent_id, conversation_id, requested_by):
        return {"agent_id": agent_id, "conversation_id": conversation_id,
                "requested_by": requested_by}


    def _envelope(kind, identity, **fields):
        out = {"kind": kind}
        out.update(identity)
        for key in ("pk", "uuid", "label", "process_type", "process_state",
                    "exit_status", "mtime", "url", "permalink_hint"):
            out.setdefault(key, None)
        out.update(fields)
        return out


    def _ref_pk(ref):
        if isinstance(ref, dict):
            value = ref.get("pk") or ref.get("uuid")
        else:
            value = ref
        if value is None:
            raise ValueError("ref must carry pk or uuid")
        return str(value)


    def _notebook_url(pk, listing=None):
        # A process class/label is not a notebook filename. Only link existing files.
        if listing is None:
            listing = _callbacks["list_workspace"]()
        if not isinstance(listing, dict) or not isinstance(listing.get("entries"), list):
            raise ValueError("invalid notebook inventory")
        prefix = str(pk) + "-" if pk is not None else None
        matches = sorted({entry["name"] for entry in listing["entries"]
                          if isinstance(entry, dict) and isinstance(entry.get("name"), str)
                          and not entry.get("is_dir") and prefix
                          and entry["name"].startswith(prefix)
                          and entry["name"].endswith(".ipynb")
                          and "/" not in entry["name"] and "\\" not in entry["name"]})
        status = "available" if len(matches) == 1 else "ambiguous" if matches else "not_found"
        name = matches[0] if len(matches) == 1 else None
        url = _callbacks["public_url"]("/lab/tree/notebooks/" + quote(name, safe="")) if name else None
        return {"name": name, "url": url, "status": status, "matches": matches}


    def aiidalab_browse(kind: str = "processes", label: str = None, state: str = None,
                        limit: int = 25, ref: dict = None, agent_id: str = None,
                        conversation_id: str = None, requested_by: str = None):
        """List processes, the notebook workspace, or one process's retrieved files."""
        identity = _ident(agent_id, conversation_id, requested_by)
        t = _tools()
        if kind == "workspace":
            listing = _callbacks["list_workspace"]()
            base = os.environ.get("JUPYTER_PUBLIC_URL", "https://@AIIDA_HOSTNAME@").rstrip("/")
            entries = [dict(e, url=base + "/lab/tree/notebooks/" + e["name"]) for e in listing["entries"]]
            return _envelope("workspace", identity, entries=entries,
                             url=base + listing["url_path"])
        if kind == "files":
            if not ref:
                raise ValueError("kind='files' needs ref={pk|uuid}")
            identifier = _ref_pk(ref)
            files = t.list_retrieved_files(identifier)
            rows = files if isinstance(files, list) else files.get("files", [])
            return _envelope("files", identity, pk=None, files=rows,
                             permalink_hint="call export_process_files to make these browsable")
        if kind != "processes":
            raise ValueError("kind must be processes, workspace or files")
        rows = t.list_recent_processes(limit=int(limit))
        rows = rows if isinstance(rows, list) else rows.get("processes", [])
        out = []
        listing = _callbacks["list_workspace"]()
        for row in rows:
            if label and label.lower() not in str(row.get("label") or row.get("process_label") or "").lower():
                continue
            if state and str(row.get("state") or row.get("process_state") or "").lower() != state.lower():
                continue
            pk = row.get("pk")
            notebook = _notebook_url(pk, listing)
            out.append(_envelope("process", identity, pk=pk, uuid=row.get("uuid"),
                                 label=row.get("label") or row.get("process_label"),
                                 process_type=row.get("process_type"),
                                 process_state=row.get("state") or row.get("process_state"),
                                 exit_status=row.get("exit_status"),
                                 url=notebook["url"], notebook=notebook["name"],
                                 notebook_status=notebook["status"], notebook_matches=notebook["matches"]))
        return _envelope("process", identity, entries=out, count=len(out))


    def aiidalab_open(ref: dict, agent_id: str = None, conversation_id: str = None,
                      requested_by: str = None):
        """Everything about one process: inputs, outputs, retrieved files, notebook."""
        identity = _ident(agent_id, conversation_id, requested_by)
        identifier = _ref_pk(ref)
        t = _tools()
        status = t.get_process_status(identifier)
        pk = status.get("pk") if isinstance(status, dict) else None
        inputs, outputs = t.get_node_inputs(identifier), t.get_node_outputs(identifier)
        retrieved = t.list_retrieved_files(identifier)
        notebook = _notebook_url(pk)
        return _envelope("process", identity, pk=pk, uuid=(status or {}).get("uuid"),
                         label=(status or {}).get("process_label"),
                         process_type=(status or {}).get("process_type"),
                         process_state=(status or {}).get("state"),
                         exit_status=(status or {}).get("exit_status"),
                         url=notebook["url"], notebook=notebook,
                         inputs=inputs, outputs=outputs, retrieved=retrieved)


    def aiidalab_run(ref: dict = None, changes: dict = None, spec: dict = None,
                     entry_point: str = None, wait: bool = False, timeout_seconds: int = 1800,
                     agent_id: str = None, conversation_id: str = None, requested_by: str = None):
        """Run a calculation: a full spec, a resubmit of an old one with changes, or a draft."""
        identity = _ident(agent_id, conversation_id, requested_by)
        submit_process_spec = _callbacks["submit_process_spec"]
        t = _tools()
        if spec is None:
            if ref is not None:
                built = t.build_resubmission_spec(_ref_pk(ref), overrides=changes or {})
                spec = built.get("spec", built) if isinstance(built, dict) else built
            elif entry_point:
                spec = t.draft_process_inputs(entry_point, inputs=changes or {})
                if isinstance(spec, dict) and "spec" in spec:
                    spec = spec["spec"]
                return _envelope("run", identity, draft=spec,
                                 permalink_hint="call aiidalab_run(spec=...) to submit this draft")
            else:
                raise ValueError("give spec, or ref with changes, or entry_point with changes")
        result = submit_process_spec(spec)
        pk = result.get("pk")
        summary = result
        if wait and pk is not None:
            try:
                t.wait_for_process(str(pk), timeout_seconds=int(timeout_seconds))
            except Exception:
                pass
            summary = t.get_process_status(str(pk))
        notebook = result.get("notebook") or {}
        return _envelope("run", identity, pk=pk, uuid=result.get("uuid"),
                         process_state=(summary or {}).get("state") or result.get("state"),
                         exit_status=(summary or {}).get("exit_status"),
                         url=notebook.get("url") or result.get("url"), notebook=notebook)


    def aiidalab_tail(ref: dict, follow: bool = False, n: int = 30, follow_seconds: int = 120,
                      agent_id: str = None, conversation_id: str = None, requested_by: str = None):
        """The last lines of the scheduler output and the process log, without a file browser."""
        identity = _ident(agent_id, conversation_id, requested_by)
        identifier = _ref_pk(ref)
        t = _tools()
        if follow:
            try:
                t.wait_for_process(identifier, timeout_seconds=int(follow_seconds))
            except Exception:
                pass
        status = t.get_process_status(identifier) or {}
        try:
            report = t.get_process_report(identifier, levelname="REPORT")
        except Exception:
            report = None

        def tail(filename):
            try:
                got = t.get_retrieved_file(identifier, filename, tail_lines=int(n))
                return got if not isinstance(got, dict) else got.get("content") or got.get("lines")
            except Exception as error:
                return None

        pk = status.get("pk")
        notebook = _notebook_url(pk)
        return _envelope("tail", identity, pk=pk, uuid=status.get("uuid"),
                         label=status.get("process_label"),
                         process_type=status.get("process_type"),
                         process_state=status.get("state"),
                         exit_status=status.get("exit_status"),
                         url=notebook["url"], notebook=notebook, aiida_out_tail=tail("aiida.out"),
                         scheduler_stdout_tail=tail("_scheduler-stdout.txt"),
                         logs_tail=report)


    def register(mcp, *, notebook_name_for, public_url, list_workspace, submit_process_spec):
        _callbacks.update(notebook_name_for=notebook_name_for, public_url=public_url,
                          list_workspace=list_workspace, submit_process_spec=submit_process_spec)
        for fn in (aiidalab_browse, aiidalab_open, aiidalab_run, aiidalab_tail):
            mcp.tool()(to_mcp_tool_error(fn))
