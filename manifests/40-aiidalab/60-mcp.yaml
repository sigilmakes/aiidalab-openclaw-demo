    """Read-only, sampled-path band edges for non-spin fixed-occupation BandsData."""
    import math
    import numpy as np
    from aiida.orm import BandsData, load_node
    from aiida_agents.tools._types import Identifier


    def summarize(node, *, n_electrons=None, n_occupied=None, evidence=None):
        evidence = evidence or {}
        bands = np.asarray(node.get_bands(), dtype=float)
        points = np.asarray(node.get_kpoints(), dtype=float)
        if bands.ndim != 2:
            raise ValueError("Only non-spin 2D band arrays are supported")
        if evidence.get("lsda") is not False or evidence.get("non_colinear_calculation") is not False or evidence.get("spin_orbit_calculation") is not False:
            raise ValueError("Verified non-spin, non-collinear=False and spin-orbit=False creator metadata is required")
        if evidence.get("number_of_spin_components", 1) != 1:
            raise ValueError("Spin-polarized, spinor and spin-orbit results are unsupported")
        if node.units != "eV":
            raise ValueError("Only stored eV band energies are supported")
        if not bands.size or points.shape != (bands.shape[0], 3) or not np.isfinite(bands).all() or not np.isfinite(points).all():
            raise ValueError("Band energies and fractional k-points must be finite and shape-compatible")
        if np.any(np.diff(bands, axis=1) < 0):
            raise ValueError("Band energies must be ordered within every k-point")
        if n_occupied is not None and n_electrons is not None:
            raise ValueError("Supply either n_occupied or n_electrons, not both")
        source = "explicit_n_occupied"
        if n_occupied is None:
            source = "explicit_n_electrons" if n_electrons is not None else "creator_output_parameters.number_of_electrons"
            electrons = n_electrons if n_electrons is not None else evidence.get("number_of_electrons")
            if isinstance(electrons, bool) or not isinstance(electrons, (int, float)) or not math.isfinite(electrons) or electrons <= 0 or electrons % 2:
                raise ValueError("Supply an occupied-band count or an even electron count for a non-spin fixed-occupation result")
            n_occupied = int(electrons / 2)
        if isinstance(n_occupied, bool) or not isinstance(n_occupied, int) or not 0 < n_occupied < bands.shape[1]:
            raise ValueError("n_occupied must leave both occupied and empty bands in the stored array")
        creator_electrons = evidence.get("number_of_electrons")
        if creator_electrons is not None and creator_electrons != 2 * n_occupied:
            raise ValueError("Occupied count contradicts creator electron count")
        if evidence.get("occupations") != "fixed":
            raise ValueError("Verified fixed occupations are required; smearing or unknown occupation mode is unsupported")
        try:
            _, occupations = node.get_bands(also_occupations=True)
        except AttributeError:
            occupations = None
        if occupations is not None:
            occupations = np.asarray(occupations, dtype=float)
            if occupations.shape != bands.shape or not np.allclose(occupations[:, :n_occupied], 2, atol=1e-6, rtol=0) or not np.allclose(occupations[:, n_occupied:], 0, atol=1e-6, rtol=0):
                raise ValueError("Stored occupations do not support the requested non-spin fixed occupied-band partition")
        elif evidence.get("occupations") not in (None, "fixed"):
            raise ValueError("Missing occupations for a non-fixed-occupation result")
        labels = list(node.labels or [])
        label_map = dict(labels)
        valence = bands[:, n_occupied - 1]
        conduction = bands[:, n_occupied]
        vi, ci, di = int(np.argmax(valence)), int(np.argmin(conduction)), int(np.argmin(conduction - valence))
        vbm = float(valence[vi])
        def edge(energy, index, band_index):
            return {"energy": float(energy), "k_index": index, "band_index": band_index, "k_frac": points[index].tolist(), "label": label_map.get(index)}
        candidates = [{"source": "BandsData.array_vbm", "energy": vbm, "units": "eV"}]
        for key in ("fermi_energy", "highest_occupied_level"):
            value = evidence.get(key)
            if isinstance(value, (int, float)) and not isinstance(value, bool) and math.isfinite(value) and evidence.get(key + "_units") == "eV":
                candidates.append({"source": "creator_output_parameters." + key, "energy": value, "units": "eV"})
        segments = evidence.get("explicit_segments")
        breaks = None
        if segments is not None:
            if not segments or any(len(s) != 2 or any(isinstance(i, bool) or not isinstance(i, int) for i in s) or not 0 <= s[0] < s[1] <= bands.shape[0] for s in segments):
                raise ValueError("Invalid explicit segment metadata")
            breaks = []
            for previous, current in zip(segments, segments[1:]):
                if previous[1] == current[0]:
                    breaks.append(current[0])
                elif previous[1] != current[0] + 1:
                    raise ValueError("Explicit segments do not describe a continuous or discontinuous sampled path")
        return {
            "pk": node.pk, "uuid": str(node.uuid), "units": node.units,
            "n_kpoints": bands.shape[0], "n_bands": bands.shape[1], "n_occupied": n_occupied,
            "occupied_count_source": source,
            "occupations_verified": occupations is not None,
            "occupation_assumption": None if occupations is not None else "Non-spin, fixed occupied-band partition; not inferred from energy ordering",
            "VBM": edge(valence[vi], vi, n_occupied - 1), "CBM": edge(conduction[ci], ci, n_occupied),
            "minimum_direct_gap": {"energy": float(conduction[di] - valence[di]), "k_index": di},
            "indirect_gap": float(conduction[ci] - vbm),
            "reference_energy_candidates": candidates,
            "zero_reference": {"source": "BandsData.array_vbm", "energy": vbm, "units": "eV", "operation": "subtract from stored energies"},
            "absolute_energy_reference": "unknown; stored eigenvalues do not define a vacuum reference",
            "label_numbers": [int(i) for i, _ in labels], "labels": [s for _, s in labels],
            "segment_break_indices": breaks,
            "segment_break_source": evidence.get("segment_source") if segments is not None else "unavailable: no linked explicit-segment metadata; no label-adjacency inference",
            "explicit_segments": segments,
            "edge_selection": "First representative of exact equal extrema; no degeneracy grouping or tolerance applied",
            "sampled_path_only": True, "global_brillouin_zone_gap": False,
            "provenance": evidence.get("provenance", {}),
        }


    def get_band_edge_summary(identifier: Identifier, n_electrons: int | None = None, n_occupied: int | None = None) -> dict:
        """Read sampled-path band edges from stored BandsData (pk/UUID/label). No submission, writes or execution. Non-spin, fixed occupations only. Indices are zero-based; gap is not a global Brillouin-zone claim. Choose n_occupied OR an even n_electrons if provenance lacks a count."""
        from fastmcp.exceptions import ToolError
        try:
            node = load_node(identifier)
            if not isinstance(node, BandsData):
                raise ValueError("identifier must select BandsData, not its WorkChain or CalcJob")
            evidence = {}
            creator = node.creator
            if creator is not None:
                evidence["provenance"] = {"creator_pk": creator.pk, "creator_uuid": str(creator.uuid)}
                try:
                    parameters = creator.outputs.output_parameters.get_dict()
                except (AttributeError, KeyError):
                    parameters = {}
                for key in ("number_of_electrons", "number_of_spin_components", "lsda", "spin_polarized", "non_colinear_calculation", "spin_orbit_calculation", "fermi_energy", "fermi_energy_units", "highest_occupied_level", "highest_occupied_level_units"):
                    if key in parameters:
                        evidence[key] = parameters[key]
                try:
                    evidence["occupations"] = creator.inputs.parameters.get_dict().get("SYSTEM", {}).get("occupations")
                except (AttributeError, KeyError):
                    pass
                try:
                    kpoints = creator.inputs.kpoints
                    path_creator = kpoints.creator
                    if path_creator is not None:
                        path_parameters = path_creator.outputs.parameters
                        path_data = path_parameters.get_dict()
                        explicit_points = np.asarray(kpoints.get_kpoints(), dtype=float)
                        # The creator must identify these very k-points as its explicit path output.
                        same_output = path_creator.outputs.explicit_kpoints.pk == kpoints.pk
                        if same_output and explicit_points.shape == np.asarray(node.get_kpoints()).shape and np.allclose(explicit_points, node.get_kpoints(), atol=1e-8, rtol=0):
                            evidence["explicit_segments"] = path_data.get("explicit_segments")
                            evidence["segment_source"] = {"path_creator_pk": path_creator.pk, "parameters_pk": path_parameters.pk, "field": "explicit_segments", "end_exclusive": True, "fractional_coordinate_atol": 1e-8}
                except (AttributeError, KeyError):
                    pass
            return summarize(node, n_electrons=n_electrons, n_occupied=n_occupied, evidence=evidence)
        except (ValueError, TypeError) as exc:
            raise ToolError(str(exc)) from exc


    def register(mcp):
        mcp.tool(get_band_edge_summary)

  retrieved_head.py: |
    """Bounded first-line reads of a CalcJob's exact retrieved file."""
    from aiida_agents.tools._types import Identifier
    from aiida_agents.tools.processes import _retrieved_folder
    from aiida.common.exceptions import NotExistent
    from fastmcp.exceptions import ToolError

    MAX_BYTES = 20000


    def _read_head(stream, head_lines):
        # One sentinel byte establishes omission without scanning a large file.
        raw = stream.read(MAX_BYTES + 1)
        capped = len(raw) > MAX_BYTES
        bounded = raw[:MAX_BYTES]
        lines = bounded.splitlines(keepends=True)
        selected = lines[:head_lines]
        content_bytes = b"".join(selected)
        omitted = capped or len(lines) > head_lines
        return {
            "content": content_bytes.decode("utf-8", errors="replace"),
            "head_lines_requested": head_lines,
            "lines_returned": len(selected),
            "truncated": omitted,
            "selection": "head",
            "bytes_read": len(raw),
            "max_bytes": MAX_BYTES,
            "lines_total": None,
        }


    def get_retrieved_file_head(identifier: Identifier, filename: str, head_lines: int = 12) -> dict:
        """Read the first 1..100 lines (default12) of a CalcJob's exact retrieved filename. Bounded to20000 raw bytes plus one sentinel; no writes or execution. Remaining content is omitted, never replaced with the tail. Total line count is unknown. Text is raw, not interpreted scientific units."""
        if isinstance(head_lines, bool) or not isinstance(head_lines, int) or not 1 <= head_lines <= 100:
            raise ToolError("head_lines must be an integer between1 and100")
        if not isinstance(filename, str) or not filename or "/" in filename or "\\" in filename or filename in (".", ".."):
            raise ToolError("filename must be an exact retrieved-file basename from list_retrieved_files")
        try:
            node, retrieved = _retrieved_folder(identifier)
            objects = {item.name: item for item in retrieved.base.repository.list_objects()}
            if filename not in objects or not objects[filename].is_file():
                raise ToolError("filename is not an exact retrieved file; consult list_retrieved_files")
            with retrieved.base.repository.open(filename, mode="rb") as stream:
                result = _read_head(stream, head_lines)
            return {"pk": node.pk, "filename": filename, **result}
        except (NotExistent, FileNotFoundError) as exc:
            raise ToolError("CalcJob or retrieved file is unavailable") from exc


    def register(mcp):
        from aiida_agents.mcp.tools import to_mcp_tool_error
        mcp.tool(to_mcp_tool_error(get_retrieved_file_head))


  workspace_fs.py: |
    """Agent file tools for the AiiDAlab workspace: everything under notebooks/.

    Every call goes through the Jupyter contents API, the same authority the
    AiiDAlab file browser uses, so what an agent changes is what a human sees. The
    Jupyter root is the whole home directory; this module exposes only the
    notebooks/ subtree, so .aiida, credentials and the mounted tools are not
    reachable from here.

    Paths are relative to notebooks/ and may name subdirectories. No tool
    overwrites an existing target. Notebook links come back as /lab/tree/ URLs.

    Jupyter runs with allow_hidden false (the jupyter_server default, unset in this
    image), so it refuses any dot-directory: the trash therefore lives in
    notebooks/trash/, not notebooks/.trash/. A permanent delete removes the entry
    from the workspace; jupyter_server's own delete_to_trash may still keep a copy
    in the Jupyter user's XDG trash, which is outside notebooks/ and not reachable
    from these tools.
    """

    import posixpath
    import time
    from urllib.parse import quote

    NOTEBOOK_DIR = "notebooks"
    # Visible on purpose: jupyter_server refuses hidden paths, so a dot-trash could
    # not be created, moved into or deleted through the contents API.
    TRASH_ROOT = "trash"
    MAX_DEPTH = 16

    _callbacks = {}


    def register(mcp, *, jupyter, notebook_dir, public_url):
        """Wire these tools to the server's Jupyter bridge, workspace root and URL builder."""
        from aiida_agents.mcp.tools import to_mcp_tool_error

        _callbacks.update(jupyter=jupyter, notebook_dir=notebook_dir, public_url=public_url)
        for tool in (workspace_stat, workspace_mkdir, workspace_move, workspace_copy, workspace_delete):
            mcp.tool()(to_mcp_tool_error(tool))


    def _jupyter(method, endpoint, **kwargs):
        return _callbacks["jupyter"](method, endpoint, **kwargs)


    def _notebook_dir():
        return _callbacks.get("notebook_dir") or NOTEBOOK_DIR


    def _rel(path, label, *, allow_root=False):
        """Return a caller path relative to notebooks/, or refuse it.

        Absolute paths, '..' segments, NUL and other control characters, and
        backslashes are refused, so no accepted path can name anything outside
        notebooks/. Normalization drops '.' and empty segments; it never resolves a
        parent segment.
        """
        if not isinstance(path, str):
            raise ValueError("%s must be a string" % label)
        if path.startswith("/"):
            raise ValueError("%s is relative to %s/, not absolute: %r"
                             % (label, _notebook_dir(), path))
        if "\\" in path:
            raise ValueError("%s must use '/' as its only separator: %r" % (label, path))
        if any(ord(char) < 32 for char in path):
            raise ValueError("%s must not contain NUL or other control characters" % label)
        if ".." in path.split("/"):
            raise ValueError("%s must not contain '..': %r" % (label, path))
        rel = posixpath.normpath(path)
        if rel == ".":
            rel = ""
        if not rel:
            if allow_root:
                return ""
            raise ValueError("%s must name something inside %s/" % (label, _notebook_dir()))
        if rel.split("/")[0] == _notebook_dir():
            raise ValueError("%s is already relative to %s/, drop the %r prefix: %r"
                             % (label, _notebook_dir(), _notebook_dir(), path))
        return rel


    def _rooted(rel):
        return _notebook_dir() + "/" + rel if rel else _notebook_dir()


    def _escape(path):
        return "/".join(quote(part, safe="") for part in path.split("/"))


    def _endpoint(rel):
        return "/api/contents/" + _escape(_rooted(rel))


    def _url(rel):
        return _callbacks["public_url"]("/lab/tree/" + _escape(_rooted(rel)))


    def _entry(rel, model):
        return {"path": rel, "type": model.get("type"), "size": model.get("size"),
                "mtime": model.get("last_modified"), "url": _url(rel)}


    def _stat(rel):
        """Model for one entry; a 404 becomes 'not found', other failures pass through."""
        try:
            return _jupyter("GET", _endpoint(rel), params={"content": 0})
        except RuntimeError as error:
            if "-> 404:" in str(error):
                raise ValueError("not found in the workspace: %r" % (rel or ".")) from error
            raise


    def _exists(rel):
        try:
            _stat(rel)
        except ValueError:
            return False
        return True


    def _require_absent(rel):
        if _exists(rel):
            raise ValueError("target already exists and nothing here overwrites: %r" % rel)


    def _require_not_inside(source, destination):
        # Reading the children of a directory that contains its own copy would
        # recurse into the copy being written.
        if destination.startswith(source + "/"):
            raise ValueError("target must not be inside the source: %r" % destination)


    def _ensure_root():
        # A directory save on an existing directory is logged and accepted, so this
        # is idempotent; a fresh profile has no notebooks/ yet.
        _jupyter("PUT", _endpoint(""), json={"type": "directory"})


    def _ensure_dir(rel):
        """Create rel and its missing parents, one level per save; returns what was created.

        Jupyter saves a directory with a single mkdir, so a missing parent fails
        there and has to be created first, outermost first.
        """
        created = []
        parts = rel.split("/") if rel else []
        for index in range(1, len(parts) + 1):
            prefix = "/".join(parts[:index])
            if not _exists(prefix):
                _jupyter("PUT", _endpoint(prefix), json={"type": "directory"})
                created.append(prefix)
        return created


    def _children(rel):
        listing = _jupyter("GET", _endpoint(rel), params={"content": 1})
        children = listing.get("content")
        if not isinstance(children, list):
            raise RuntimeError("Jupyter returned no directory listing for %r" % rel)
        return children


    def _child_entry(rel, child):
        name = child.get("name")
        return {"name": name, "path": rel + "/" + str(name) if rel else str(name),
                "type": child.get("type"), "size": child.get("size"),
                "mtime": child.get("last_modified")}


    def workspace_stat(path: str = "") -> dict:
        """Describe one file, notebook or directory in the workspace. path is relative to notebooks/ ("" is the workspace root) and may be nested, e.g. 819-files/aiida.out. A directory result also carries its children, so this is the tree listing: name, path, type, size and mtime per child. Read-only."""
        rel = _rel(path, "path", allow_root=True)
        model = _stat(rel)
        result = _entry(rel, model)
        if model.get("type") == "directory":
            result["entries"] = [_child_entry(rel, child) for child in _children(rel)]
        return result


    def workspace_mkdir(path: str) -> dict:
        """Create a directory in the workspace, with missing parents. path is relative to notebooks/, e.g. runs/2026-10. Refuses a path that already exists; returns the new directory and the paths created."""
        rel = _rel(path, "path")
        _require_absent(rel)
        _ensure_root()
        created = _ensure_dir(posixpath.dirname(rel))
        _jupyter("PUT", _endpoint(rel), json={"type": "directory"})
        created.append(rel)
        result = _entry(rel, _stat(rel))
        result["created"] = created
        return result


    def workspace_move(path: str, target: str) -> dict:
        """Rename or move one entry inside the workspace (a rename, not a copy). Both paths are relative to notebooks/; target parents are created. Refuses an existing target; use workspace_copy to duplicate instead."""
        source = _rel(path, "path")
        destination = _rel(target, "target")
        model = _stat(source)
        _require_absent(destination)
        _require_not_inside(source, destination)
        _ensure_root()
        _ensure_dir(posixpath.dirname(destination))
        moved = _jupyter("PATCH", _endpoint(source), json={"path": _rooted(destination)})
        return {"source": _entry(source, model), "target": _entry(destination, moved)}


    def workspace_copy(path: str, target: str) -> dict:
        """Copy a file, notebook or whole directory inside the workspace. Both paths are relative to notebooks/; target parents are created. Refuses an existing target. Content is read and written per entry, so a directory is recreated recursively; returns files and bytes copied."""
        source = _rel(path, "path")
        destination = _rel(target, "target")
        model = _stat(source)
        _require_absent(destination)
        _require_not_inside(source, destination)
        _ensure_root()
        counts = {"files": 0, "bytes": 0}
        _copy_entry(source, destination, model, counts, 0)
        return {"source": _entry(source, model),
                "target": _entry(destination, _stat(destination)),
                "copied": counts}


    def _copy_entry(source, destination, model, counts, depth):
        if model.get("type") == "directory":
            if depth >= MAX_DEPTH:
                raise ValueError("directory nesting is deeper than %d levels at %r" % (MAX_DEPTH, source))
            children = _children(source)
            _ensure_dir(destination)
            for child in children:
                name = child.get("name")
                if not isinstance(name, str) or not name or "/" in name:
                    raise RuntimeError("Jupyter returned an unusable directory entry under %r" % source)
                _copy_entry(source + "/" + name, destination + "/" + name, child, counts, depth + 1)
            return
        payload = _jupyter("GET", _endpoint(source), params={"content": 1})
        if payload.get("type") == "notebook":
            body = {"type": "notebook", "format": "json", "content": payload.get("content")}
        else:
            body = {"type": "file", "format": payload.get("format") or "text",
                    "content": payload.get("content")}
        _jupyter("PUT", _endpoint(destination), json=body)
        counts["files"] += 1
        counts["bytes"] += int(model.get("size") or 0)


    def workspace_delete(path: str, trash: bool = True, confirm: bool = False) -> dict:
        """Delete one entry in the workspace. trash=true (default) moves it to notebooks/trash/<UTC timestamp>/<name>, so it can be restored from the file browser. trash=false removes it from the workspace and is refused unless confirm=true as well. Returns what was moved or removed."""
        for value, label in ((trash, "trash"), (confirm, "confirm")):
            if type(value) is not bool:
                raise ValueError("%s must be true or false" % label)
        if not trash and not confirm:
            raise ValueError("trash=false deletes permanently; pass confirm=true as well")
        rel = _rel(path, "path")
        model = _stat(rel)
        if not trash:
            _jupyter("DELETE", _endpoint(rel))
            return {"deleted": _entry(rel, model), "trash": False, "target": None}
        destination = _trash_target(rel)
        _ensure_root()
        _ensure_dir(posixpath.dirname(destination))
        moved = _jupyter("PATCH", _endpoint(rel), json={"path": _rooted(destination)})
        return {"deleted": _entry(rel, model), "trash": True,
                "target": _entry(destination, moved)}


    def _trash_target(rel):
        """A free path under notebooks/trash/<UTC timestamp>/ for the basename of rel."""
        stamp = time.strftime("%Y%m%dT%H%M%SZ", time.gmtime())
        name = posixpath.basename(rel)
        destination = "%s/%s/%s" % (TRASH_ROOT, stamp, name)
        suffix = 1
        while _exists(destination):
            suffix += 1
            destination = "%s/%s/%s-%d" % (TRASH_ROOT, stamp, name, suffix)
        return destination

---
apiVersion: v1
kind: Service
metadata:
  name: aiida-mcp
  namespace: aiidalab
  labels:
    app: aiida-mcp
spec:
  selector:
    app: aiida-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiida-mcp
  namespace: aiidalab
  labels:
    app: aiida-mcp
spec:
  replicas: 1
  # RollingUpdate so a roll is always-hot: the new pod joins the endpoints before
  # the old one drops. Recreate left a refusal window on every roll, which is what
  # the probe saw as transient 401/500 during earlier redeploys. maxUnavailable 0
  # also means a broken image never takes the service down: the old keeps serving.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aiida-mcp
  template:
    metadata:
      labels:
        app: aiida-mcp
      annotations:
        # Roll the pod when the ConfigMap content changes; Kubernetes does not
        # restart consumers on its own.
        # Rendered at build time from the ConfigMap data in this file (see
        # services/nixos/aiidalab-openclaw-demo/render-manifests.py). Never hardcode it.
        checksum/code: "@MCP_CODE_CHECKSUM@"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-proxy
          image: sandbox.local/aiidalab:26.10.0
          imagePullPolicy: IfNotPresent
          # No SLURM ssh key is staged or mounted here: submission is the
          # daemon's job, and this pod must not hold a credential that can
          # reach the Slurm controller.
          command:
            - /opt/venvs/agents/bin/python
            - /opt/mcp/front.py
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: HOME
              value: /home/aiida
            # sitecustomize here flips aiida-core's import_sys_environment default,
            # which rootless slurmd cannot honour.
            # The lab venv supplies aiida-quantumespresso; this venv does not have
            # it. An init container copies just those packages into /plugins, and
            # /plugins is on PYTHONPATH because every tool runs its work in a child
            # interpreter, which only sees PYTHONPATH, not runtime sys.path edits.
            # Never point this at the whole lab site-packages: cachetools resolves
            # from there, and fastmcp then dies with "MemoryStore requires
            # py-key-value-aio[memory]" and the server never starts.
            - name: PYTHONPATH
              value: /plugins:/opt/aiida-override
            # Notebook tools go through the Jupyter server's contents API, so the
            # files are created by Jupyter itself and appear in the AiiDAlab browser.
            - name: JUPYTER_URL
              value: http://aiidalab:8888
            # Absolute base for the link the agent posts. The tool returns it
            # already joined, so a model never has to build a URL itself.
            - name: JUPYTER_PUBLIC_URL
              value: https://@AIIDA_HOSTNAME@
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiidalab-jupyter
                  key: JUPYTER_TOKEN
            - name: AIIDA_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiida-mcp
                  key: token
          ports:
            - name: http
              containerPort: 8080
          # An authenticated initialize, not a TCP check: a dead mcp-proxy child
          # kept the pod at 1/1 Running while every call answered 500 with
          # "ConnectError" to 127.0.0.1:8081. This is the regression that hid it.
          readinessProbe:
            exec:
              command:
                - /opt/venvs/agents/bin/python
                - -c
                - |
                  import os, sys, httpx
                  body = {"jsonrpc": "2.0", "id": 1, "method": "initialize",
                          "params": {"protocolVersion": "2025-03-26", "capabilities": {},
                                     "clientInfo": {"name": "readiness", "version": "0"}}}
                  headers = {"Authorization": "Bearer " + os.environ["AIIDA_MCP_TOKEN"],
                             "Accept": "application/json, text/event-stream"}
                  try:
                      response = httpx.post("http://127.0.0.1:8080/mcp", json=body,
                                            headers=headers, timeout=5)
                  except Exception:
                      sys.exit(1)
                  if response.status_code != 200 or not response.headers.get("mcp-session-id"):
                      sys.exit(1)
                  session = response.headers["mcp-session-id"]
                  try:
                      httpx.delete("http://127.0.0.1:8080/mcp", headers={**headers, "Mcp-Session-Id": session}, timeout=2)
                  except Exception:
                      pass
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 8
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            # filer's exporter, mounted inside the PVC without shadowing it.
            - name: aiida-tools
              mountPath: /home/aiida/aiida-tools
              readOnly: true
            - name: plugins
              mountPath: /plugins
              readOnly: true
            - name: code
              mountPath: /opt/mcp
              readOnly: true
            - name: home
              mountPath: /home/aiida
            - name: slurm-override
              mountPath: /opt/aiida-override
              readOnly: true
            - name: tmp
              mountPath: /tmp
      initContainers:
        # aiida-quantumespresso lives only in the lab venv. Copy the two packages
        # it needs so the agents venv can see its entry points without taking the
        # whole lab site-packages onto its path.
        - name: plugins
          image: sandbox.local/aiidalab:26.10.0
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              set -eu
              lab=/opt/venvs/lab/lib/python3.12/site-packages
              cp -a "$lab"/aiida_quantumespresso "$lab"/aiida_quantumespresso-*.dist-info \
                    "$lab"/qe_tools "$lab"/qe_tools-*.dist-info /plugins/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: plugins
              mountPath: /plugins
      volumes:
        - name: aiida-tools
          configMap:
            name: aiida-tools
        - name: plugins
          emptyDir: {}
        - name: code
          configMap:
            name: aiida-mcp-code
        - name: home
          persistentVolumeClaim:
            claimName: aiidalab-home
        - name: slurm-override
          configMap:
            name: aiida-slurm-override
        - name: tmp
          emptyDir: {}
