# PVC names and sizes are fixed by the swarm contract. local-path (k3s default).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiidalab-postgres
  namespace: aiidalab
spec:
  storageClassName: @STORAGE_CLASS@
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiidalab-rabbitmq
  namespace: aiidalab
spec:
  storageClassName: @STORAGE_CLASS@
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiidalab-home
  namespace: aiidalab
spec:
  storageClassName: @STORAGE_CLASS@
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 30Gi
