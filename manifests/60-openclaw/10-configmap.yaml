apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: aiidalab-openclaw-demo
data:
  # openclaw.json is the single source of truth for the gateway. Secrets are
  # SecretRefs resolved from the container environment (BIFROST_VK,
  # OPENCLAW_GATEWAY_PASSWORD, AIIDA_MCP_TOKEN); nothing secret is stored here.
  #
  # Model catalogue: every id below answered a live completion through Bifrost
  # (2026-10-29). The five ids the project does not enable are absent.
  #
  # browser.ssrfPolicy.allowedHostnames is the navigation allowlist. Public
  # hostnames outside it are refused while browser DNS pinning is unavailable;
  # add a host here rather than turning the SSRF policy off.
  openclaw.json: |
    {
      "agents": {
        "ownership": "explicit",
        "defaults": {
          "workspace": "/srv/openclaw/workspace",
          "model": {
            "primary": "bifrost/claude-sonnet-5-5",
            "fallbacks": [
              "bifrost/claude-opus-5",
              "bifrost/claude-sonnet-5"
            ]
          },
          "utilityModel": "bifrost/claude-haiku-4-5",
          "thinkingDefault": "low",
          "sandbox": {
            "mode": "off"
          },
          "heartbeat": {
            "every": "0m",
            "agentId": "main"
          },
          "systemAgent": {
            "agentId": "main"
          }
        },
        "entries": {
          "main": {
            "name": "Main",
            "description": "General assistant with AiiDA process tools."
          }
        }
      },
      "browser": {
        "enabled": true,
        "headless": true,
        "noSandbox": true,
        "executablePath": "/bin/chromium",
        "ssrfPolicy": {
          "dangerouslyAllowPrivateNetwork": false,
          "allowedHostnames": [
            "example.org",
            "@AIIDA_HOSTNAME@",
            "@CLAW_HOSTNAME@"
          ]
        }
      },
      "discovery": {
        "mdns": {
          "mode": "off"
        }
      },
      "gateway": {
        "mode": "local",
        "port": 18789,
        "portals": {
          "ingress": {
            "domain": "@PORTAL_DOMAIN@",
            "port": 18790
          }
        },
        "bind": "custom",
        "customBindHost": "0.0.0.0",
        "publicOrigin": "https://@CLAW_HOSTNAME@",
        "trustedProxies": [
          "10.42.0.0/16"
        ],
        "controlUi": {
          "allowedOrigins": [
            "https://@CLAW_HOSTNAME@",
            "http://127.0.0.1:18789",
            "http://localhost:18789"
          ]
        },
        "auth": {
          "mode": "password",
          "password": {
            "source": "env",
            "provider": "default",
            "id": "OPENCLAW_GATEWAY_PASSWORD"
          }
        },
        "terminal": {
          "enabled": false
        }
      },
      "mcp": {
        "servers": {
          "aiida": {
            "enabled": true,
            "transport": "streamable-http",
            "url": "http://aiida-mcp.aiidalab.svc.cluster.local:8080/mcp",
            "headers": {
              "Authorization": "Bearer ${AIIDA_MCP_TOKEN}"
            }
          }
        }
      },
      "memory": {
        "citations": "auto",
        "search": {
          "enabled": true,
          "provider": "none",
          "sources": [
            "memory",
            "sessions"
          ]
        }
      },
      "models": {
        "mode": "replace",
        "catalogRefresh": {
          "enabled": false
        },
        "providers": {
          "bifrost": {
            "api": "openai-completions",
            "apiKey": {
              "source": "env",
              "provider": "default",
              "id": "BIFROST_VK"
            },
            "baseUrl": "http://bifrost.bifrost.svc.cluster.local:8080/v1",
            "models": [
              {
                "id": "claude-sonnet-5-5",
                "name": "Claude Sonnet 5.5",
                "reasoning": true,
                "input": [
                  "text",
                  "image"
                ],
                "contextWindow": 200000,
                "maxTokens": 64000,
                "compat": {
                  "supportsReasoningEffort": true,
                  "supportedReasoningEfforts": [
                    "low",
                    "medium",
                    "high",
                    "max"
                  ],
                  "thinkingFormat": "openai"
                }
              },
              {
                "id": "claude-opus-5-5",
