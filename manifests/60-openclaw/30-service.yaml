apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: aiidalab-openclaw-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/component: gateway
  ports:
  - name: gateway
    port: 18789
    targetPort: gateway
    protocol: TCP
  # Portals listen on their own port inside the same container; cloudflared
  # routes *.@PORTAL_DOMAIN@ here.
  - name: portal
    port: 18790
    # The gateway's portal listener is loopback-only; the portal-bridge sidecar
    # relays it onto the pod network on 18791.
    targetPort: 18791
    protocol: TCP
