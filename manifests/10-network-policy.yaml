# Intra-namespace smoke-test path requested by bifrost: the vertex-smoke Job
# reaches the in-namespace gateway on 8080. Addendum to the network matrix.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: bifrost-smoke-path
    namespace: bifrost
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: bifrost
            app.kubernetes.io/component: gateway
    policyTypes:
        - Ingress
    ingress:
        - from:
            - podSelector:
                matchLabels:
                    app.kubernetes.io/name: bifrost-vertex-smoke
          ports:
            - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: bifrost-smoke-egress
    namespace: bifrost
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: bifrost-vertex-smoke
    policyTypes:
        - Egress
    egress:
        - to:
            - podSelector:
                matchLabels:
                    app.kubernetes.io/name: bifrost
                    app.kubernetes.io/component: gateway
          ports:
            - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: allow-slurm-ingress
    namespace: slurm
spec:
    podSelector: {}
    policyTypes:
        - Ingress
    ingress:
        # sshd listens on 2222 in the pod; the Service maps 22 -> 2222 and
        # kube-router evaluates policy after DNAT, so the pod port is what counts.
        - from:
            - namespaceSelector:
                matchLabels:
                    kubernetes.io/metadata.name: aiidalab
          ports:
            - {protocol: TCP, port: 2222}
            - {protocol: TCP, port: 6817}
---
